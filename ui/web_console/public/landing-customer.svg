<svg width="520" height="440" viewBox="0 0 520 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Always in touch with the customer">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f8fd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f3a5f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="520" height="440" rx="18" fill="url(#bg2)"/>

  <!-- customer (small-business owner) -->
  <g filter="url(#soft2)">
    <circle cx="130" cy="150" r="34" fill="#f2c6a0"/>
    <path d="M130 116a34 34 0 0 1 34 28h-68a34 34 0 0 1 34-28z" fill="#2d3f57"/>
    <rect x="80" y="196" width="100" height="118" rx="26" fill="#3bb0d6"/>
    <circle cx="130" cy="150" r="34" fill="none"/>
    <path d="M118 150a6 6 0 0 1 12 0" fill="none"/>
    <path d="M116 160q14 10 28 0" stroke="#b5753f" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- phone in hand -->
  <g filter="url(#soft2)">
    <rect x="150" y="236" width="56" height="104" rx="12" fill="#2d3f57"/>
    <rect x="156" y="246" width="44" height="84" rx="6" fill="#eaf3fb"/>
  </g>

  <!-- floating chat window with three bubbles -->
  <g filter="url(#soft2)">
    <rect x="232" y="72" width="236" height="296" rx="18" fill="#ffffff" stroke="#dbe7f2" stroke-width="2"/>
    <rect x="232" y="72" width="236" height="40" rx="18" fill="#2d3f57"/>
    <rect x="232" y="94" width="236" height="18" fill="#2d3f57"/>
    <circle cx="252" cy="92" r="6" fill="#3bb0d6"/>
    <text x="268" y="97" font-family="DM Sans, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Service updates</text>

    <!-- bubble 1: technician on the way -->
    <rect x="248" y="128" width="180" height="46" rx="12" fill="#eef4fa"/>
    <text x="262" y="148" font-family="DM Sans, sans-serif" font-size="12" fill="#2d3f57">A technician is on</text>
    <text x="262" y="164" font-family="DM Sans, sans-serif" font-size="12" fill="#2d3f57">the way to you.</text>

    <!-- bubble 2: two appointment times -->
    <rect x="248" y="186" width="200" height="62" rx="12" fill="#eef4fa"/>
    <text x="262" y="206" font-family="DM Sans, sans-serif" font-size="12" fill="#2d3f57">Choose a time:</text>
    <rect x="262" y="214" width="78" height="22" rx="6" fill="#ffffff" stroke="#3bb0d6" stroke-width="1.5"/>
    <text x="301" y="229" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11" fill="#2d3f57">9-11 AM</text>
    <rect x="348" y="214" width="78" height="22" rx="6" fill="#ffffff" stroke="#cfe0f0" stroke-width="1.5"/>
    <text x="387" y="229" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11" fill="#5a6b80">2-4 PM</text>

    <!-- bubble 3: completion with green tick -->
    <rect x="248" y="260" width="200" height="46" rx="12" fill="#e3f5ec"/>
    <circle cx="268" cy="283" r="11" fill="#3bb273"/>
    <path d="M263 283l4 4 7-8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="286" y="280" font-family="DM Sans, sans-serif" font-size="12" font-weight="600" fill="#1f7a4d">Your service is</text>
    <text x="286" y="296" font-family="DM Sans, sans-serif" font-size="12" font-weight="600" fill="#1f7a4d">complete.</text>

    <!-- reply field -->
    <rect x="248" y="320" width="200" height="30" rx="15" fill="#f3f6fa" stroke="#dbe7f2" stroke-width="1.5"/>
    <text x="264" y="339" font-family="DM Sans, sans-serif" font-size="11" fill="#8a98a8">Reply…</text>
    <circle cx="432" cy="335" r="12" fill="#3bb0d6"/>
    <path d="M427 335h9m-4-4l4 4-4 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
