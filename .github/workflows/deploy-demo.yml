name: deploy-demo

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a demo deployment'
        required: true
        default: ""

permissions:
  id-token: write   # GitHub OIDC role assumption
  contents: read

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    environment: demo   # requires manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OPSRESOLVE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,infra]"
      - name: Deploy stacks
        run: ./scripts/deploy.sh demo
      - name: Seed data
        run: python scripts/seed.py --env demo
      - name: Smoke test (happy path, SMS simulator)
        run: pytest -q tests/e2e -k happy || true
      - name: Publish evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: tests/eval/
